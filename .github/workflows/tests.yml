name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Environment
        run: python -m llm.env
      - name: Tests
        run: |
          set -o pipefail
          pytest -q -rf 2>&1 | tee pytest.log || {
            # surface the failure summary as an annotation (readable from the checks API)
            echo "::error title=pytest::$(tail -n 40 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          }
