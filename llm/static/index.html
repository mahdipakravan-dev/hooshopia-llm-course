<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>چت‌بات هوشوپیا</title>
<style>
  :root { --bg:#100e17; --panel:#191d34; --line:#2c2838; --ink:#f0e8e0; --muted:#a9adbf; --gold:#f8d048; --user:#2a3358; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font: 16px/1.8 Vazirmatn, Tahoma, system-ui, sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; }
  header b { color:var(--gold); }
  header small { color:var(--muted); direction:ltr; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; max-width:820px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; max-width:85%; white-space:pre-wrap; word-break:break-word; }
  .user { background:var(--user); align-self:flex-start; }
  .assistant { background:var(--panel); border:1px solid var(--line); align-self:flex-end; }
  .empty { color:var(--muted); text-align:center; margin-top:20vh; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); max-width:820px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px;
             padding:10px; font:inherit; min-height:48px; max-height:160px; }
  button { background:var(--gold); color:#13101d; border:0; border-radius:10px; padding:0 18px; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <div><b>هوشوپیا</b> · چت‌بات از صفر، بدون API</div>
  <div><small id="info"></small> <button class="ghost" id="reset" type="button">گفتگوی جدید</button></div>
</header>
<div id="log"><div class="empty">یه چیزی بپرس…</div></div>
<form id="form">
  <textarea id="input" placeholder="پیام…" rows="1" autofocus></textarea>
  <button id="send">ارسال</button>
</form>
<script>
const log = document.getElementById("log"), input = document.getElementById("input"),
      form = document.getElementById("form"), send = document.getElementById("send");
let messages = [];

fetch("/api/info").then(r => r.json()).then(i => {
  document.getElementById("info").textContent = `${(i.params / 1e6).toFixed(1)}M params · ${i.context} tokens`;
}).catch(() => {});

function bubble(role, text) {
  const empty = log.querySelector(".empty"); if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = "msg " + role; div.textContent = text;
  log.appendChild(div); log.scrollTop = log.scrollHeight;
  return div;
}

document.getElementById("reset").onclick = () => { messages = []; log.innerHTML = '<div class="empty">یه چیزی بپرس…</div>'; };
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

form.onsubmit = async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = ""; send.disabled = true;
  messages.push({ role: "user", content: text });
  bubble("user", text);
  const out = bubble("assistant", "…");
  let answer = "";
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                          body: JSON.stringify({ messages }) });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const events = buf.split("\n\n"); buf = events.pop();
      for (const ev of events) {
        const data = ev.replace(/^data: /, "");
        if (data === "[DONE]") continue;
        answer += JSON.parse(data).text;
        out.textContent = answer; log.scrollTop = log.scrollHeight;
      }
    }
  } catch (err) { out.textContent = "خطا: " + err; }
  if (!answer) out.textContent = "(جوابی تولید نشد)";
  messages.push({ role: "assistant", content: answer });
  send.disabled = false; input.focus();
};
</script>
</body>
</html>
